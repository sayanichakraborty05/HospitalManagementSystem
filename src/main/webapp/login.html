<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — MediCore</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

<nav class="navbar">
  <div class="container">
    <a href="index_1.html" class="brand"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-7 4 14 3-10 2 3h5"/></svg> MediCore</a>
    <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
    <div class="nav-links">
      <a href="index_1.html" data-nav="index">Home</a>
      <a href="about.html" data-nav="about">About</a>
      <a href="appointment.html" data-nav="appointment">Appointments</a>
      <a href="pharmacy.html" data-nav="pharmacy">Pharmacy</a>
      <a href="lab-test.html" data-nav="lab-test">Lab Tests</a>
      <a href="emergency.html" data-nav="emergency">Emergency</a>
      <a href="contact.html" data-nav="contact">Contact</a>
    </div>
    <div class="nav-cta">
      <a href="patient-login.html" class="btn btn-outline btn-sm">Patient login</a>
    </div>
  </div>
</nav>

<section class="container">
  <form id="staffLoginForm" class="card form-card" action="StaffLoginServlet" method="POST">
    <h2>Staff / Admin login</h2>
    <p class="form-hint" style="margin-bottom:18px">For hospital admin, doctors and pharmacy staff only.</p>
    <div class="alert alert-info js-form-msg" style="display:none"></div>
    <div class="form-group">
      <label for="role">Login as</label>
      <select id="role" name="role" required>
        <option value="admin">Admin</option>
        <option value="doctor">Doctor</option>
      </select>
    </div>
    <div class="form-group">
      <label for="userId">Staff ID / Email</label>
      <input id="userId" name="userId" type="text" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
    <p class="form-foot"><a href="register.html">New staff account request →</a></p>
  </form>
</section>

<footer>
  <div class="container">
    <span>© 2026 MediCore Hospital Management System</span>
    <span>Java Servlets · JSP · MySQL</span>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
