<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Prescription — MediCore</title>
<link rel="stylesheet" href="style.css">
</head>

<body data-page="issue-prescription">

<nav class="navbar">
<div class="container">

<a href="index_1.html" class="brand">
<svg viewBox="0 0 24 24">
<path d="M2 12h4l2-7 4 14 3-10 2 3h5"/>
</svg>
MediCore
</a>

<button class="nav-toggle" onclick="toggleNav()">&#9776;</button>

<div class="nav-links"></div>

<div class="nav-cta">

<span class="badge badge-ok" style="align-self:center">
Doctor:
<span class="staff-name-placeholder">Doctor</span>
</span>

<a href="LogoutServlet" class="btn btn-outline btn-sm">
Logout
</a>

</div>

</div>
</nav>

<div class="dash">

<aside class="sidebar">

<h3>Doctor Menu</h3>

<a href="doctor-dashboard.html" class="active">
Dashboard
</a>

<h3>Account</h3>

<a href="LogoutServlet">
Logout
</a>

</aside>

<main class="dash-main">

<h1>Issue Prescription</h1>

<p>
Patient :
<strong id="patientNameDisplay">-</strong>
</p>

<form id="prescriptionForm"
class="card card-pad"
style="max-width:640px">

<div class="alert alert-info js-form-msg"
style="display:none"></div>

<div class="form-group">

<label>Valid Till</label>

<input
type="date"
id="validTill"
name="validTill"
required>

</div>

<h3>Medicines</h3>

<div id="medicineRows"></div>

<button
type="button"
class="btn btn-outline btn-sm"
onclick="addMedicineRow()"
style="margin-bottom:16px">

+ Add Medicine

</button>

<input
type="hidden"
id="patientId"
name="patientId">

<input
type="hidden"
id="itemsData"
name="itemsData">

<button
type="submit"
class="btn btn-primary btn-block">

Save Prescription

</button>

</form>

</main>

</div>

<script src="script.js"></script>

<script>

const params=new URLSearchParams(window.location.search);

const patientId=params.get("patientId");

const appointmentId=params.get("appointmentId");

const patientName=params.get("patientName");

document.getElementById("patientNameDisplay").textContent=
patientName||"-";

document.getElementById("patientId").value=
patientId||"";

let rowCount=0;

function addMedicineRow(){

rowCount++;

const div=document.createElement("div");

div.className="form-row";

div.style.marginBottom="10px";

div.innerHTML=`
<div class="form-group">
<label>Medicine Name</label>
<input type="text" class="med-name" required>
</div>

<div class="form-group">
<label>Dosage</label>
<input type="text" class="med-dosage" required>
</div>

<div class="form-group">
<label>Duration</label>
<input type="text" class="med-duration" required>
</div>
`;

document.getElementById("medicineRows").appendChild(div);

}

addMedicineRow();

document.getElementById("prescriptionForm")

.addEventListener("submit",function(e){

e.preventDefault();

const names=document.querySelectorAll(".med-name");

const dosages=document.querySelectorAll(".med-dosage");

const durations=document.querySelectorAll(".med-duration");

const items=[];

for(let i=0;i<names.length;i++){

items.push(
names[i].value+"~"+
dosages[i].value+"~"+
durations[i].value
);

}

document.getElementById("itemsData").value=
items.join("|");

const data=new URLSearchParams();

data.set("patientId",
document.getElementById("patientId").value);

data.set("appointmentId",
appointmentId||"");

data.set("validTill",
document.getElementById("validTill").value);

data.set("itemsData",
document.getElementById("itemsData").value);

fetch("IssuePrescriptionServlet",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:data.toString()

})
    .then(response=>{

        if(!response.ok){

            throw new Error();

        }

        return response.text();

    })

    .then(()=>{

        alert("Prescription saved successfully.");

        window.location.href="doctor-dashboard.html";

    })

    .catch(()=>{

        alert("Unable to save prescription. Please try again.");

    });

});

fetch("StaffInfoServlet")

.then(response=>{

    if(!response.ok){

        throw new Error();

    }

    return response.text();

})

.then(name=>{

    document.querySelectorAll(".staff-name-placeholder")

    .forEach(function(el){

        el.textContent=name;

    });

})

.catch(()=>{

    document.querySelectorAll(".staff-name-placeholder")

    .forEach(function(el){

        el.textContent="Doctor";

    });

});

</script>

</body>
</html>
