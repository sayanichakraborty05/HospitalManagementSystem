<p>
A record of your visits, diagnoses and vitals over time.
</p>

<div class="card card-pad">

<table>

<tr>
<th>Date</th>
<th>Doctor</th>
<th>Diagnosis</th>
<th>Notes</th>
</tr>

<tbody id="historyRows">

<tr>
<td colspan="4">
Loading...
</td>
</tr>

</tbody>

<script src="script.js"></script>

<script>
      fetch("PatientInfoServlet")
    .then(response => {
      if (!response.ok) {
        throw new Error("Failed to load patient info");
      }
      return response.text();
    })
    .then(name => {
      document.querySelectorAll(".patient-name-placeholder").forEach(el => {
        el.textContent = name;
      });
    })
    .catch(error => {
      console.error(error);
      document.querySelectorAll(".patient-name-placeholder").forEach(el => {
        el.textContent = "Guest";
      });
    });

  fetch("MyMedicalHistoryServlet")
    .then(response => {
      if (!response.ok) {
        throw new Error("Failed to load medical history");
      }
      return response.text();
    })
    .then(html => {
      document.getElementById("historyRows").innerHTML = html;
    })
    .catch(error => {
      console.error(error);
      document.getElementById("historyRows").innerHTML =
        "<tr><td colspan='4'>No medical history found.</td></tr>";
    });

</script>

</body>
