<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Registration — MediCore</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="patient-register">

<nav class="navbar">
  <div class="container">
    <a href="index_1.html" class="brand"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-7 4 14 3-10 2 3h5"/></svg> MediCore</a>
    <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
    <div class="nav-links">
      <a href="index_1.html" data-nav="index">Home</a>
      <a href="about.html" data-nav="about">About</a>
      <a href="appointment.html" data-nav="appointment">Appointments</a>
      <a href="pharmacy.html" data-nav="pharmacy">Pharmacy</a>
      <a href="lab-test.html" data-nav="lab-test">Lab Tests</a>
      <a href="emergency.html" data-nav="emergency">Emergency</a>
      <a href="contact.html" data-nav="contact">Contact</a>
    </div>
    <div class="nav-cta">
      <a href="patient-login.html" class="btn btn-outline btn-sm">Log in</a>
      <a href="patient-register.html" class="btn btn-primary btn-sm">Register</a>
    </div>
  </div>
</nav>

<section class="container">
  <form id="patientRegForm" class="card form-card" style="max-width:640px" action="PatientRegisterServlet" method="POST">
    <h2>Create patient account</h2>
    <div class="alert alert-info js-form-msg" style="display:none"></div>
    <div class="form-row">
      <div class="form-group">
        <label for="fname">Full name</label>
        <input id="fname" name="fullName" type="text" required>
      </div>
      <div class="form-group">
        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="date" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select</option>
          <option>Female</option><option>Male</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="blood">Blood group</label>
        <select id="blood" name="bloodGroup">
          <option value="">Unknown</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" required>
      </div>
      <div class="form-group">
        <label for="pincode">Pincode</label>
        <input id="pincode" name="pincode" type="text" maxlength="6" required>
      </div>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="2" required></textarea>
    </div>
    <div class="form-group">
      <label for="emergency">Emergency contact (name &amp; phone)</label>
      <input id="emergency" name="emergencyContact" type="text" placeholder="e.g. Ramesh Sharma, 90000 00001">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
    <p class="form-foot">Already registered? <a href="patient-login.html">Log in</a></p>
  </form>
</section>

<footer>
  <div class="container">
    <span>© 2026 MediCore Hospital Management System</span>
    <span>Java Servlets · JSP · MySQL</span>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
